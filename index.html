    <style>
        :root {
            --byzantine-gold: #b8860b;
            --gold-light: #d4af37;
            --parchment-bg: #fdfbf7;
            --parchment-card: #f4efe6;
            --border-gold: #d2b48c;
            --text-dark: #1a1a1a;
            --text-muted: #5c534e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--parchment-bg);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(253, 251, 247, 0.98);
            border-bottom: 2px solid var(--byzantine-gold);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            color: var(--text-dark);
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 0;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--byzantine-gold);
        }

        /* Hero Header */
        header {
            background: linear-gradient(rgba(20, 20, 20, 0.6), rgba(20, 20, 20, 0.6)), url('exterior.jpg') no-repeat center center/cover;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 5px solid var(--byzantine-gold);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.25;
        }

        header p {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px;
        }
